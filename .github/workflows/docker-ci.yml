name: Docker Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Build Docker image
      run: docker build -t ml-service:test .
      
    - name: Test image dependencies
      run: |
        docker run --rm ml-service:test python -c "
        import fastapi
        import mlflow
        import pandas
        import sklearn
        import numpy
        print('All dependencies installed successfully')
        "
    
    - name: Run tests in container
      run: |
        docker run --rm ml-service:test python -m pytest tests || true
    
    - name: Validate docker-compose
      run: docker compose config
      
    - name: Security scan with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ml-service:test
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install flake8 black isort
        
    - name: Run flake8
      run: flake8 Obesity_Estimation/Module --max-line-length=99 || true
      
    - name: Check formatting with black
      run: black --check Obesity_Estimation/Module || true
      
    - name: Check imports with isort
      run: isort --check --diff Obesity_Estimation/Module || true
