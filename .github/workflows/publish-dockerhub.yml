name: Publish to DockerHub

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Extract version from tag
      id: vars
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${GITHUB_REF#refs/tags/v}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "MAJOR=$(echo $VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT
        echo "MINOR=$(echo $VERSION | cut -d. -f1-2)" >> $GITHUB_OUTPUT
    
    - name: Build and test
      run: |
        docker build -t ml-service:latest .
        docker run --rm ml-service:latest python -c "import fastapi, mlflow, pandas, sklearn; print('Dependencies OK')"
    
    - name: Tag Docker image
      run: |
        docker tag ml-service:latest ${{ secrets.DOCKERHUB_USERNAME }}/ml-service:${{ steps.vars.outputs.VERSION }}
        docker tag ml-service:latest ${{ secrets.DOCKERHUB_USERNAME }}/ml-service:${{ steps.vars.outputs.MINOR }}
        docker tag ml-service:latest ${{ secrets.DOCKERHUB_USERNAME }}/ml-service:${{ steps.vars.outputs.MAJOR }}
        docker tag ml-service:latest ${{ secrets.DOCKERHUB_USERNAME }}/ml-service:latest
    
    - name: Push to DockerHub
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ml-service:${{ steps.vars.outputs.VERSION }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ml-service:${{ steps.vars.outputs.MINOR }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ml-service:${{ steps.vars.outputs.MAJOR }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ml-service:latest
    
    - name: Create release notes
      run: |
        echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${{ steps.vars.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/ml-service:${{ steps.vars.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/ml-service:${{ steps.vars.outputs.MINOR }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/ml-service:${{ steps.vars.outputs.MAJOR }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/ml-service:latest\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Pull command:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ml-service:${{ steps.vars.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Run command:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "docker run -p 8000:8000 ${{ secrets.DOCKERHUB_USERNAME }}/ml-service:${{ steps.vars.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
